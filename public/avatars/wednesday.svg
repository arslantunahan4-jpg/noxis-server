  <circle cx="82" cy="82" r="4" fill="#451a03"/>
  <circle cx="82" cy="82" r="1.5" fill="#000000"/>

  <ellipse cx="118" cy="82" rx="7" ry="5" fill="#ffffff"/>
  <circle cx="118" cy="82" r="4" fill="#451a03"/>
  <circle cx="118" cy="82" r="1.5" fill="#000000"/>

  <!-- Düz Çizgi Kaşlar -->
  <line x1="72" y1="74" x2="90" y2="74" stroke="#020617" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="110" y1="74" x2="128" y2="74" stroke="#020617" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Dudaklar (İnce ve İfadesiz) -->
